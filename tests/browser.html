<!doctype html><html lang="es"><meta charset="utf-8"><title>Pruebas del carrusel</title><style>body{font:16px system-ui;margin:24px;background:#f8f6f1;color:#292522}li{margin:10px}iframe{border:1px solid #ccc;height:650px;width:390px} .pass{color:#1b6d31}.fail{color:#a21c1c}</style><h1>Pruebas de imágenes y carrusel</h1><ol id="results"></ol><div id="fixtures"></div><script>
(async()=>{
  const results=document.querySelector('#results');
  function check(ok,label){const li=document.createElement('li');li.textContent=(ok?'PASS · ':'FAIL · ')+label;li.className=ok?'pass':'fail';results.append(li);if(!ok)throw new Error(label);}
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const html=await(await fetch('/index.html')).text(),base=await(await fetch('/site-content.json')).json();
  const photo=base.photos.aboutDesktop;
  const content={...base,trainingGallery:{photos:Array.from({length:5},(_,i)=>({...photo,alt:'Foto de prueba '+(i+1)})),video:{src:'media/11111111111111111111111111111111.mp4',alt:'Vídeo de prueba',position:{x:50,y:50}}}};
  async function fixture(reduced=false,fail=false){
    const frame=document.createElement('iframe');frame.allow='autoplay';document.querySelector('#fixtures').append(frame);
    const bootstrap=`<script>
      window.fixtureRelease=null;window.fixtureOptions=null;
      window.fetch=(url,options)=>{window.fixtureOptions=options;return new Promise(resolve=>window.fixtureRelease=()=>resolve({ok:${!fail},json:async()=>(${JSON.stringify(content)})}));};
      const observers=[];window.IntersectionObserver=class{constructor(callback){this.callback=callback;observers.push(this)}observe(){setTimeout(()=>this.callback([{isIntersecting:true}]),0)}};
      window.fixtureVisible=value=>observers.forEach(observer=>observer.callback([{isIntersecting:value}]));
      window.matchMedia=query=>({matches:query.includes('reduce')?${reduced}:false,addEventListener(){}});
    <\/script>`;
    // Test the actual page markup/CSS and media module; omit unrelated scripts.
    const clean=html.replace(/<script\b[^>]*>[\s\S]*?<\/script>/g,'').replace('<head>','<head><base href="/">'+bootstrap+'<script src="/site-media.js"><\/script>');
    frame.srcdoc=clean;
    await new Promise(resolve=>frame.onload=resolve);
    const w=frame.contentWindow,d=w.document;
    check([...d.querySelectorAll('[data-site-photo]')].every(img=>!img.hasAttribute('src')),'Ninguna foto antigua mientras llega el contenido');
    check(w.fixtureOptions.cache==='no-store','Contenido publicado sin reutilizar caché');
    w.fixtureRelease();await wait(250);
    return {frame,w,d};
  }
  try{
    const {frame,w,d}=await fixture();
    check(d.querySelector('[data-site-photo="hero"]').getAttribute('src')===base.photos.hero.src,'Primera foto = última foto publicada');
    check(d.querySelectorAll('.training-slide img').length===5&&d.querySelectorAll('.training-slide video').length===1,'Cinco fotos y un vídeo');
    check(d.querySelector('[data-training-count]').textContent==='1 / 6','Orden inicial correcto');
    await wait(4200);
    check(d.querySelector('[data-training-count]').textContent==='2 / 6','Avance automático después de cuatro segundos');
    w.fixtureVisible(false);const before=d.querySelector('[data-training-count]').textContent;await wait(4200);
    check(d.querySelector('[data-training-count]').textContent===before,'Pausa al salir de la sección');
    w.fixtureVisible(true);
    d.querySelectorAll('[data-training-dots] button')[5].click();
    check(d.querySelector('[data-training-count]').textContent==='6 / 6','Selección manual del vídeo');
    const video=d.querySelector('.training-slide video');
    check(video.muted&&video.playsInline,'Vídeo sin sonido y compatible con reproducción en línea');
    d.querySelector('[data-training-toggle]').click();
    await wait(2700);
    check(d.querySelector('[data-training-count]').textContent==='1 / 6'&&video.paused,'El vídeo termina a los dos segundos y vuelve a la primera foto');
    frame.remove();
    const reduced=await fixture(true);await wait(4200);
    check(reduced.d.querySelector('[data-training-count]').textContent==='1 / 6','Movimiento reducido desactiva la rotación automática');
    reduced.d.querySelector('[data-training-next]').click();
    check(reduced.d.querySelector('[data-training-count]').textContent==='2 / 6','Navegación manual con movimiento reducido');
    reduced.d.querySelector('[data-training-carousel]').scrollIntoView();
    check(reduced.d.documentElement.scrollWidth<=390,'Sin desbordamiento horizontal en móvil');
    const failed=await fixture(false,true);
    check(!!failed.d.querySelector('.media-retry')&&[...failed.d.querySelectorAll('[data-site-photo]')].every(img=>!img.hasAttribute('src')),'Error de red: reintento disponible sin mostrar imágenes antiguas');
    failed.frame.remove();
    document.title='PASS · Pruebas del carrusel completadas';
  }catch(error){const li=document.createElement('li');li.className='fail';li.textContent=error.stack;results.append(li);document.title='FAIL · Pruebas del carrusel';}
})();
</script></html>
