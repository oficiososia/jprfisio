<!doctype html><html lang="es"><meta charset="utf-8"><title>Pruebas de la galería</title><style>body{font:16px system-ui;margin:24px;background:#f8f6f1;color:#292522}li{margin:10px}iframe{border:1px solid #ccc;height:900px;width:390px} .pass{color:#1b6d31}.fail{color:#a21c1c}</style><h1>Pruebas de imágenes y galería de entrenamiento</h1><ol id="results"></ol><div id="fixtures"></div><script>
(async()=>{
  const results=document.querySelector('#results');
  function check(ok,label){const li=document.createElement('li');li.textContent=(ok?'PASS · ':'FAIL · ')+label;li.className=ok?'pass':'fail';results.append(li);if(!ok)throw new Error(label);}
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  async function until(test,ms=4000){const end=Date.now()+ms;while(Date.now()<end){if(test())return true;await wait(50);}return test();}
  const html=await(await fetch('/index.html')).text(),base=await(await fetch('/site-content.json')).json();
  const photo=base.photos.aboutDesktop;
  const content={...base,trainingGallery:{photos:Array.from({length:5},(_,i)=>({...photo,alt:'Foto de prueba '+(i+1)})),video:{src:'media/11111111111111111111111111111111.mp4',alt:'Vídeo de prueba',position:{x:50,y:50}}}};
  async function fixture({reduced=false,fail=false,width=1200}={}){
    const frame=document.createElement('iframe');frame.allow='autoplay';frame.style.width=width+'px';document.querySelector('#fixtures').append(frame);
    const bootstrap=`<script>
      window.fixtureRelease=null;window.fixtureOptions=null;
      window.fetch=(url,options)=>{window.fixtureOptions=options;return new Promise(resolve=>window.fixtureRelease=()=>resolve({ok:${!fail},json:async()=>(${JSON.stringify(content)})}));};
      const observers=[];window.IntersectionObserver=class{constructor(callback){this.callback=callback;observers.push(this)}observe(){setTimeout(()=>this.callback([{isIntersecting:true}]),0)}};
      window.fixtureVisible=value=>observers.forEach(observer=>observer.callback([{isIntersecting:value}]));
      window.matchMedia=query=>({matches:query.includes('reduce')?${reduced}:false,addEventListener(){}});
    <\/script>`;
    // Test the actual page markup/CSS and media module; omit unrelated scripts.
    const clean=html.replace(/<script\b[^>]*>[\s\S]*?<\/script>/g,'').replace('<head>','<head><base href="/">'+bootstrap+'<script src="/site-media.js"><\/script>');
    frame.srcdoc=clean;
    await new Promise(resolve=>frame.onload=resolve);
    const w=frame.contentWindow,d=w.document;
    check([...d.querySelectorAll('[data-site-photo]')].every(img=>!img.hasAttribute('src')),'Ninguna foto antigua mientras llega el contenido');
    check(w.fixtureOptions.cache==='no-store','Contenido publicado sin reutilizar caché');
    w.fixtureRelease();await wait(300);
    d.querySelector('[data-training-carousel]').scrollIntoView({block:'center'});
    return {frame,w,d};
  }
  const count=d=>d.querySelector('[data-training-count]').textContent;
  const sideSources=d=>[...d.querySelectorAll('[data-training-side] .tg-media')].map(media=>media.getAttribute('src'));
  try{
    const {frame,w,d}=await fixture();
    check(d.querySelector('[data-site-photo="hero"]').getAttribute('src')===base.photos.hero.src,'Primera foto = última foto publicada');
    check(d.querySelectorAll('.tg-main-photo img').length===5&&d.querySelectorAll('.tg-main-photo video').length===1,'Cinco fotos y un vídeo en la foto principal');
    check(count(d)==='1 / 6'&&d.querySelector('[data-training-prev]').disabled&&!d.querySelector('[data-training-next]').disabled,'Empieza en la primera foto con la flecha anterior desactivada');
    check(await until(()=>d.querySelector('.tg-main-photo img').classList.contains('media-ready')),'La primera foto se carga');
    check(d.querySelectorAll('[data-training-side] button').length===2&&!!d.querySelector('[data-training-side] .tg-all-label'),'Dos fotos laterales; la segunda abre la galería');
    check(sideSources(d).every(src=>src===photo.src),'Las fotos laterales muestran las dos siguientes');
    await wait(4500);
    check(count(d)==='1 / 6','Sin avance automático: solo cambia al navegar');
    d.querySelector('[data-training-next]').click();
    check(await until(()=>count(d)==='2 / 6'),'La flecha siguiente avanza una foto');
    for(let i=0;i<4;i++){d.querySelector('[data-training-next]').click();await wait(700);}
    check(await until(()=>count(d)==='6 / 6')&&d.querySelector('[data-training-next]').disabled,'Llega al vídeo y la flecha siguiente se desactiva');
    check(sideSources(d)[0]===photo.src,'Después del vídeo se vuelve a ofrecer la primera foto');
    const video=d.querySelector('.tg-main-photo video');
    check(video.muted&&video.playsInline,'Vídeo sin sonido y compatible con reproducción en línea');
    check(await until(()=>!video.paused&&video.currentTime>0.3,6000),'El vídeo se reproduce al estar en pantalla');
    await wait(2600);
    check(!video.paused&&video.currentTime<2.1,'El vídeo repite solo los dos primeros segundos');
    w.fixtureVisible(false);await wait(100);
    check(video.paused,'Pausa al salir de la sección');
    w.fixtureVisible(true);
    const viewer=d.querySelector('[data-training-viewer]');
    const openAll=d.querySelector('[data-training-open]');
    openAll.focus();openAll.click();
    check(viewer.open&&d.querySelectorAll('[data-viewer-thumbs] button').length===6,'La galería ampliada se abre con seis miniaturas');
    check(d.querySelector('[data-viewer-count]').textContent==='06 / 06'&&d.querySelectorAll('[data-viewer-thumbs] button')[5].getAttribute('aria-pressed')==='true','La galería se abre en el elemento visible');
    check(await until(()=>video.paused),'El vídeo de la página se pausa con la galería abierta');
    d.querySelector('[data-viewer-prev]').click();
    check(await until(()=>d.querySelector('[data-viewer-count]').textContent==='05 / 06'),'Navegación dentro de la galería');
    d.querySelector('[data-viewer-close]').click();
    check(!viewer.open&&await until(()=>count(d)==='5 / 6'),'Al cerrar, la foto principal coincide con la última vista');
    check(d.activeElement===openAll,'El foco vuelve al botón que abrió la galería');
    const second=d.querySelectorAll('.tg-main-photo')[1];
    d.querySelector('[data-training-prev]').click();await wait(700);d.querySelector('[data-training-prev]').click();await wait(700);d.querySelector('[data-training-prev]').click();
    check(await until(()=>count(d)==='2 / 6'),'La flecha anterior retrocede');
    second.click();
    check(viewer.open&&d.querySelector('[data-viewer-count]').textContent==='02 / 06','Pulsar la foto principal la amplía');
    viewer.close();
    check(await until(()=>d.activeElement===second),'El foco vuelve a la foto ampliada');
    frame.remove();
    const reduced=await fixture({reduced:true,width:390});
    for(let i=0;i<5;i++){reduced.d.querySelector('[data-training-next]').click();await wait(80);}
    check(await until(()=>count(reduced.d)==='6 / 6'),'Navegación con movimiento reducido');
    await wait(800);
    check(reduced.d.querySelector('.tg-main-photo video').paused,'Movimiento reducido no reproduce el vídeo automáticamente');
    check(getComputedStyle(reduced.d.querySelector('[data-training-side]')).display==='none','En móvil se muestra solo la foto principal');
    check(reduced.d.documentElement.scrollWidth<=390,'Sin desbordamiento horizontal en móvil');
    reduced.frame.remove();
    const failed=await fixture({fail:true,width:390});
    check(!!failed.d.querySelector('.media-retry')&&[...failed.d.querySelectorAll('[data-site-photo]')].every(img=>!img.hasAttribute('src')),'Error de red: reintento disponible sin mostrar imágenes antiguas');
    failed.frame.remove();
    document.title='PASS · Pruebas de la galería completadas';
  }catch(error){const li=document.createElement('li');li.className='fail';li.textContent=error.stack;results.append(li);document.title='FAIL · Pruebas de la galería';}
})();
</script></html>
